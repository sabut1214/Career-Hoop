version: '3.8'
services:
  db:
    image: postgres:15
    container_name: careerhoop-db
    environment:
      POSTGRES_USER: careerhoop
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: careerhoop
      TZ: UTC  # Ensure this is set to UTC
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: