# Server Configuration
server.port=8080

# Database Configuration
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/careerhoop?options=-c%20TimeZone=UTC
spring.datasource.username=careerhoop
spring.datasource.password=secret

# JPA Configuration - Change from validate to update for initial setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.careerhoop=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG
