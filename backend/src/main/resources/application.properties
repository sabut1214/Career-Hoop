# Server Configuration
server.port=8080
# Increase max HTTP request size to handle large base64 images (default is 2MB)
server.tomcat.max-http-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Database Configuration
# WARNING: In production, use environment variables for all sensitive values
# DO NOT commit actual passwords or secrets to version control
spring.datasource.url=jdbc:postgresql://localhost:5432/careerhoop?options=-c%20TimeZone=UTC
spring.datasource.username=careerhoop
spring.datasource.password=${DB_PASSWORD:secret}

# JPA Configuration
# WARNING: In production, ALWAYS use 'validate' to prevent accidental schema changes
# Use 'update' only for local development
# Options: validate, update, create, create-drop, none
# validate: Validates schema against entities, fails if mismatch (SAFE for production)
# update: Updates schema to match entities (UNSAFE - can cause data loss in production)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Data Import Configuration
# Set this to the absolute path of your data folder, or leave empty to auto-detect
# Example for Windows: data.import.path=E:/CareerHoop/data
# Example for Linux/Mac: data.import.path=/path/to/CareerHoop/data
data.import.path=E:/CareerHoop/data

# Admin Configuration
# WARNING: In production, ALWAYS use environment variables for admin credentials
# DO NOT use default values in production
# Environment variables: APP_ADMIN_EMAIL and APP_ADMIN_PASSWORD
app.admin.email=${APP_ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# JWT Configuration
# WARNING: In production, ALWAYS use environment variable JWT_SECRET
# Generate a secure 256-bit secret: openssl rand -base64 32
# DO NOT use the default value in production
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-to-a-secure-random-string}
# Access token expiration: 30 minutes (1800000 milliseconds)
jwt.access-token-expiration=1800000
# Refresh token expiration: 7 days (604800000 milliseconds)
jwt.refresh-token-expiration=604800000

# Cookie Configuration
# WARNING: In production, set these via environment variables
# app.cookie.secure should be true in production (requires HTTPS)
# For local development over HTTP, default to false so auth cookies are sent
app.cookie.secure=${APP_COOKIE_SECURE:false}
# Options: Strict, Lax, None (use Lax for development, Strict for production)
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
# Cookie max age in seconds (default: 604800 = 7 days)
app.cookie.max-age=${APP_COOKIE_MAX_AGE:604800}

# CORS Configuration
# WARNING: In production, restrict to your actual frontend domain(s)
# Comma-separated list of allowed origins
# For production, set APP_CORS_ALLOWED_ORIGINS environment variable (e.g., https://yourdomain.com)
# Default values are for local development only
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# CSRF Configuration
# WARNING: In production, CSRF should be enabled (default: true)
# Set to false only for local development if needed
app.csrf.enabled=${APP_CSRF_ENABLED:true}

# AI Service Configuration (OpenAI/OpenRouter compatible)
# For local development, set AI_API_KEY in your environment.
ai.api.key=${AI_API_KEY:}

# Base URL for the AI API (OpenAI-compatible)
# For OpenAI:    https://api.openai.com/v1
# For OpenRouter: https://openrouter.ai/api/v1
ai.api.base-url=https://api.openai.com/v1

# Model to use (can be overridden via AI_API_MODEL)
# Make sure this is a valid model id for your chosen provider
ai.api.model=${AI_API_MODEL:gpt-4.1-mini}

# Optional: HTTP-Referer for OpenRouter (your app URL)
ai.api.http-referer=${AI_API_HTTP_REFERER:http://localhost:5173}

# Optional: X-Title for OpenRouter (your app name)
ai.api.x-title=${AI_API_X_TITLE:CareerHoop}

# Python ML Recommendation Service Configuration
# URL of the Python recommendation service
python.recommendation.service.url=http://localhost:8000
# Enable/disable Python recommendation service (fallback to Java logic if disabled)
python.recommendation.service.enabled=true
# Timeout in milliseconds for Python service calls
python.recommendation.service.timeout=5000


smtp.api.key=${MAIL_PASSWORD:}
# Logging
logging.level.com.careerhoop=DEBUG
logging.level.com.careerhoop.service.PythonRecommendationService=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG

# Email Configuration
# For password reset functionality
#
# Environment variables (recommended for production):
#   MAIL_HOST - SMTP server hostname
#   MAIL_PORT - SMTP server port (587 for TLS, 465 for SSL, 25 for plain)
#   MAIL_USERNAME - SMTP authentication username (usually your email)
#   MAIL_PASSWORD - SMTP authentication password or app-specific password
#   FRONTEND_URL - Frontend application URL for password reset links
#
# Common Email Provider Configurations:
#
# Brevo (formerly Sendinblue) - Recommended for production:
#   MAIL_HOST=smtp.brevo.com
#   MAIL_PORT=587
#   MAIL_USERNAME=your-brevo-smtp-login (usually your email)
#   MAIL_PASSWORD=your-brevo-smtp-key
#   Get credentials from: https://app.brevo.com/settings/keys/api
#   Note: Go to SMTP & API > SMTP tab to find your SMTP login and key
#
# Gmail:
#   MAIL_HOST=smtp.gmail.com
#   MAIL_PORT=587
#   MAIL_USERNAME=your-email@gmail.com
#   MAIL_PASSWORD=your-app-specific-password (generate from Google Account settings)
#   Note: Enable 2FA and create an App Password for Gmail
#
# Mailtrap (for testing/development):
#   MAIL_HOST=smtp.mailtrap.io
#   MAIL_PORT=2525
#   MAIL_USERNAME=your-mailtrap-username
#   MAIL_PASSWORD=your-mailtrap-password
#
# Outlook/Office365:
#   MAIL_HOST=smtp.office365.com
#   MAIL_PORT=587
#   MAIL_USERNAME=your-email@outlook.com
#   MAIL_PASSWORD=your-password
#
# SendGrid:
#   MAIL_HOST=smtp.sendgrid.net
#   MAIL_PORT=587
#   MAIL_USERNAME=apikey
#   MAIL_PASSWORD=your-sendgrid-api-key
#
# AWS SES:
#   MAIL_HOST=email-smtp.region.amazonaws.com
#   MAIL_PORT=587
#   MAIL_USERNAME=your-ses-smtp-username
#   MAIL_PASSWORD=your-ses-smtp-password
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email configuration
# Email sender address (from field) for password reset and other emails
app.mail.from=${MAIL_FROM:noreply@careerhoop.com}

# Frontend URL (kept for backward compatibility, not used in OTP flow)
# For local development: http://localhost:5173
# For production: https://yourdomain.com
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# eSewa Payment Gateway Configuration
# ============================================
# Merchant code (scd). For eSewa UAT use EPAYTEST.
esewa.merchant-code=${ESEWA_MERCHANT_CODE:EPAYTEST}
# Payment form post URL.
esewa.payment-url=${ESEWA_PAYMENT_URL:https://uat.esewa.com.np/epay/main}
# Transaction verification URL (transrec).
esewa.verify-url=${ESEWA_VERIFY_URL:https://uat.esewa.com.np/epay/transrec}
# Public callback URLs that eSewa redirects to after payment.
esewa.success-callback-url=${ESEWA_SUCCESS_URL:http://localhost:8080/api/payments/esewa/success}
esewa.failure-callback-url=${ESEWA_FAILURE_URL:http://localhost:8080/api/payments/esewa/failure}
# Frontend URL to redirect the user back to after backend verification.
esewa.frontend-return-url=${ESEWA_FRONTEND_RETURN_URL:${app.frontend.url}/payment/esewa/return}

# ============================================
# eSewa ePay V2 Payment Gateway Configuration
# ============================================
# Environment: uat or prod
esewa.v2.env=${ESEWA_V2_ENV:uat}
# Form POST URL for UAT
esewa.v2.form-url-uat=https://rc-epay.esewa.com.np/api/epay/main/v2/form
# Form POST URL for Production
esewa.v2.form-url-prod=https://epay.esewa.com.np/api/epay/main/v2/form
# Status check URL for UAT
esewa.v2.status-url-uat=https://uat.esewa.com.np/api/epay/transaction/status/
# Status check URL for Production
esewa.v2.status-url-prod=https://epay.esewa.com.np/api/epay/transaction/status/
# Secret key for signature generation (REQUIRED - from environment variable)
esewa.v2.secret-key=${ESEWA_V2_SECRET_KEY:}
# Product code (EPAYTEST for UAT, or your actual product code for production)
esewa.v2.product-code=${ESEWA_V2_PRODUCT_CODE:EPAYTEST}
# Success redirect URL (frontend route)
esewa.v2.success-url=${ESEWA_V2_SUCCESS_URL:${app.frontend.url}/payment/esewa/success}
# Failure redirect URL (frontend route)
esewa.v2.failure-url=${ESEWA_V2_FAILURE_URL:${app.frontend.url}/payment/esewa/failure}
